<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 50" width="850" height="50">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=Share+Tech+Mono&amp;display=swap');
      .header-title { font-family: 'Cinzel', serif; font-weight: 700; font-size: 18px; letter-spacing: 4px; fill: #FFFFFF; }
      .hud-tag { font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 2px; fill: #D80027; }
    </style>
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180A0E" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0E0E14" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#140608" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D80027" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#D80027" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="846" height="46" rx="8" fill="url(#glassBg)" stroke="url(#glassBorder)" stroke-width="1.2" />
  <path d="M 10 3 L 840 3" stroke="url(#topHighlight)" stroke-width="1.2" stroke-linecap="round" />
  <!-- Corner Brackets -->
  <path d="M 6 14 L 6 6 L 14 6" fill="none" stroke="#D80027" stroke-width="2" />
  <path d="M 844 14 L 844 6 L 836 6" fill="none" stroke="#D80027" stroke-width="2" />
  <path d="M 6 36 L 6 44 L 14 44" fill="none" stroke="#D80027" stroke-width="2" />
  <path d="M 844 36 L 844 44 L 836 44" fill="none" stroke="#D80027" stroke-width="2" />
  <!-- Vector Diamond HUD Marker -->
  <polygon points="26,18 33,25 26,32 19,25" fill="#D80027" />
  <polygon points="26,20 31,25 26,30 21,25" fill="#FFFFFF" fill-opacity="0.6" />
  <text x="44" y="31" class="header-title">COMBAT STATISTICS // GITHUB</text>
  <text x="825" y="30" text-anchor="end" class="hud-tag">// SPEC: METRICS_SYNC</text>
</svg>
