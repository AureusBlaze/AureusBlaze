<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 210" width="495" height="210">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #D80027; letter-spacing: 1.5px; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #E2E8F0; }
      .val-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #FFFFFF; }
      .val-gold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #FFB800; letter-spacing: 1px; }
      .val-muted { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #94A3B8; }
      .stat-pct { font-family: monospace; font-size: 11px; font-weight: 700; fill: #E2E8F0; }
    </style>
    <linearGradient id="vitalityGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000" />
      <stop offset="100%" stop-color="#D80027" />
    </linearGradient>
    <linearGradient id="dtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D80027" />
      <stop offset="50%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FFF275" />
    </linearGradient>
  </defs>

  <!-- Card Background & Border matching GitHub Stats -->
  <rect x="0.5" y="0.5" width="494" height="209" rx="4.5" fill="#0B0C10" stroke="#B30006" stroke-width="1" />

  <!-- Title Indicator -->
  <polygon points="22,17 27,23 22,29 17,23" fill="#D80027" />
  <text x="36" y="27" class="title">HUNTER STATUS // SYSTEM SPEC</text>

  <!-- Divider -->
  <line x1="20" y1="38" x2="475" y2="38" stroke="#B30006" stroke-opacity="0.3" stroke-width="1" />

  <!-- Row 1: Vitality (Code Quality) -->
  <text x="22" y="65" class="label">VITALITY (CODE QUALITY)</text>
  <rect x="230" y="55" width="190" height="12" rx="3" fill="#141721" stroke="#D80027" stroke-width="0.8" stroke-opacity="0.6" />
  <rect x="232" y="57" width="186" height="8" rx="2" fill="url(#vitalityGrad)" />
  <text x="430" y="65" class="stat-pct">100%</text>

  <!-- Row 2: Devil Trigger (Engines) -->
  <text x="22" y="97" class="label">DEVIL TRIGGER (ENGINES)</text>
  <rect x="230" y="87" width="190" height="12" rx="3" fill="#141721" stroke="#FFB800" stroke-width="0.8" stroke-opacity="0.6" />
  <rect x="232" y="89" width="186" height="8" rx="2" fill="url(#dtGrad)" />
  <text x="430" y="97" class="stat-pct" fill="#FFB800">READY</text>

  <!-- Row 3: Style Rank -->
  <text x="22" y="129" class="label">STYLE RANK</text>
  <text x="230" y="129" class="val-gold">[ SSS ] SMOKIN' SEXY STYLE!!</text>

  <!-- Row 4: Current Mission -->
  <text x="22" y="159" class="label">CURRENT MISSION</text>
  <text x="230" y="159" class="val-text">Flutter • Hard-Surface 3D • Unity/Godot</text>

  <!-- Row 5: Guild Role -->
  <text x="22" y="189" class="label">GUILD ROLE</text>
  <text x="230" y="189" class="val-muted">UI/UX Lecturer &amp; Interactive Systems</text>
</svg>
